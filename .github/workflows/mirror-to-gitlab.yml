name: Mirror to GitLab

# Suspended: no longer runs on every push, only when triggered by hand
# from the Actions tab. Re-add the "push" trigger below to turn auto-mirroring
# back on (needs the GITLAB_MIRROR_TOKEN secret set again first).
on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab mirror branch
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          git remote add gitlab-mirror "https://oauth2:${GITLAB_MIRROR_TOKEN}@imigitlab.uni-muenster.de/MeDIC/num-enrich.git"
          git push gitlab-mirror HEAD:refs/heads/github-mirror --force
